name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite with coverage
        run: |
          pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install bandit==1.9.4

      - name: Run Bandit static analysis
        run: |
          bandit -r app -ll -f txt -o bandit-report.txt
          cat bandit-report.txt

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.txt
          if-no-files-found: ignore
          retention-days: 14

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Run dependency audit
        run: |
          pip-audit -r requirements.txt --format json --output pip-audit-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("pip-audit-report.json")
          data = json.loads(path.read_text())
          dependencies = data if isinstance(data, list) else data.get("dependencies", [])
          vulnerable = [d for d in dependencies if d.get("vulns")]
          print(f"Audited {len(dependencies)} dependencies.")
          print(f"Dependencies with known vulnerabilities: {len(vulnerable)}")
          if vulnerable:
              raise SystemExit(1)
          PY

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          if-no-files-found: ignore
          retention-days: 14
